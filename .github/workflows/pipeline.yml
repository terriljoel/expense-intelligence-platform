name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expense-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_test
          POSTGRES_USER: expense_test
          POSTGRES_PASSWORD: expense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense_test -d expense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://expense_test:expense_test@localhost:5432/expense_test
      OCR_PROVIDER: tesseract
      RECEIPT_STORAGE_PROVIDER: local
      PRODUCT_AGENT_ENABLED: "false"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check formatting and code quality
        run: python -m ruff check .
      - name: Apply schema to temporary PostgreSQL
        run: python -m alembic upgrade head
      - name: Seed isolated test data
        run: python -m app.db.seed
      - name: Run tests
        run: python -m pytest -q
      - name: Check migration state
        run: python -m alembic current --check-heads
      - name: Build production container
        working-directory: ${{ github.workspace }}
        run: docker build --file apps/api/Dockerfile --tag expense-intelligence:test .

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      IMAGE_REPOSITORY: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.ACR_REPOSITORY }}
    steps:
      - uses: actions/checkout@v4

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Select immutable image version
        id: image
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "Invalid release tag: $GITHUB_REF_NAME (expected v1.2.3)" >&2
              exit 1
            }
            version="$GITHUB_REF_NAME"
          else
            version="sha-${GITHUB_SHA::12}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=${IMAGE_REPOSITORY}:$version" >> "$GITHUB_OUTPUT"
          echo "Deploying ${IMAGE_REPOSITORY}:$version"

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install migration dependencies
        working-directory: apps/api
        run: python -m pip install -r requirements.txt

      - name: Apply pending migrations to Neon
        working-directory: apps/api
        run: python -m alembic upgrade head

      - name: Deploy image to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ steps.image.outputs.name }}
