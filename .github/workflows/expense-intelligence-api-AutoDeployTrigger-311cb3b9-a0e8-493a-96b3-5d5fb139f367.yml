name: Trigger auto deployment for expense-intelligence-api

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/expense-intelligence-api-AutoDeployTrigger-311cb3b9-a0e8-493a-96b3-5d5fb139f367.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.EXPENSEINTELLIGENCEAPI_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.EXPENSEINTELLIGENCEAPI_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.EXPENSEINTELLIGENCEAPI_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.EXPENSEINTELLIGENCEAPI_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.EXPENSEINTELLIGENCEAPI_REGISTRY_PASSWORD }}
          containerAppName: expense-intelligence-api
          resourceGroup: expense-intelligence-rg
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


